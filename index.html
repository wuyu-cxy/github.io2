<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>我的个人主页</title>
    <style>
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            max-width: 800px;
            margin: 60px auto;
            padding: 0 20px;
            line-height: 1.6;
            background-color: #f4f4f9;
        }
        h1 {
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            display: inline-block;
        }
        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-top: 20px;
        }
        a {
            color: #3498db;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h1>你好，我是 [你的名字] 👋</h1>
    <div class="card">
        <p>欢迎来到我的第一个 GitHub Pages 网站！</p>
        <p>我是一名 <strong>[你的职业，如：学生/开发者/设计师]</strong>，热爱编程和创造。</p>
        <p>✨ 我正在学习如何通过 GitHub 部署静态网站，这真的太酷了！</p>
        <p>📫 联系我: <a href="#">[你的邮箱]</a></p>
    </div>
    <div class="card">
        <h3>⭐ 我的小项目</h3>
        <ul>
            <li><a href="#">项目1：Python 小游戏</a></li>
            <li><a href="#">项目2：数据分析脚本</a></li>
        </ul>
        <p>💡 未来我打算在这里展示更多我参与的开源项目。</p>
    </div>
    <p style="text-align:center; margin-top:40px;">
        2025 - 我的 GitHub 旅程
    </p>
</body>
</html>
